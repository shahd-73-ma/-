<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الساعات النسائية | GOLDEN TIME</title>
    
    <style>
        :root {
            --gold: #D4AF37;
            --black: #0c0c0c;
            --dark-gray: #1a1a1a;
        }

        body {
            background-color: var(--black);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* --- النافذة العلوية (متجاوبة) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10%;
            background-color: var(--dark-gray);
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 22px; font-weight: bold; color: var(--gold); }
        nav ul { list-style: none; display: flex; margin: 0; padding: 0; }
        nav ul li { margin-right: 20px; }
        nav ul li a { text-decoration: none; color: #fff; transition: 0.3s; font-size: 15px; }
        nav ul li a:hover { color: var(--gold); }

        .women-header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8));
            border-bottom: 1px solid #333;
        }
        .women-header h1 { color: var(--gold); font-size: 28px; margin: 0; }

        /* --- شبكة المنتجات (3 في الصف) --- */
        .products-grid {
            display: grid;
            /* يحافظ على 3 أعمدة في الشاشات الكبيرة ويتحول لعمود واحد في الجوال */
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px;
            padding: 40px 10%;
        }

        .product-card {
            background-color: var(--dark-gray);
            border: 1px solid #333;
            padding: 20px;
            text-align: center;
            transition: 0.4s;
            border-radius: 12px;
        }

        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); }

        .image-slider {
            position: relative;
            width: 100%;
            height: 250px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
        }

        .image-slider img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(212, 175, 55, 0.8);
            color: black;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }
        .prev-btn { right: 5px; }
        .next-btn { left: 5px; }

        .price { color: var(--gold); font-size: 20px; font-weight: bold; display: block; margin-bottom: 15px; }

        .details-btn {
            background-color: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
            border-radius: 5px;
        }

        /* --- نافذة المودال --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            overflow-y: auto;
        }

        .modal-content {
            background-color: var(--dark-gray);
            margin: 5% auto;
            padding: 25px;
            border: 1px solid var(--gold);
            width: 85%;
            max-width: 750px;
            border-radius: 10px;
            position: relative;
        }

        .close-btn { position: absolute; left: 15px; top: 10px; color: var(--gold); font-size: 30px; cursor: pointer; }
        .modal-body { display: flex; gap: 30px; align-items: center; }
        .modal-body img { width: 300px; border-radius: 8px; }

        /* --- تعديلات الجوال --- */
        @media (max-width: 992px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); } /* كرتين في الصف للتابلت */
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; padding: 15px 0; }
            nav ul li { margin: 0 10px; }
            .products-grid { 
                grid-template-columns: 1fr; /* كرت واحد في الصف للجوال لسهولة الرؤية */
                padding: 20px 5%;
            }
            .modal-body { flex-direction: column; text-align: center; }
            .modal-body img { width: 100%; max-width: 250px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">GOLDEN TIME</div>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="page1.html">الرجالية</a></li>
                <li><a href="page3.html" style="color: var(--gold);">النسائية</a></li>
                <li><a href="page2.html">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <div class="women-header">
        <h1>مجموعة الأناقة النسائية</h1>
    </div>

    <section class="products-grid">
        <div class="product-card">
            <div class="image-slider">
                <button class="arrow-btn prev-btn" onclick="moveSlide(this, -1)">❯</button>
                <img class="slider-img" src="image/ليدي.jpg" data-imgs='["image/ليدي1.jpg", "image/ليدي2.jpg", "image/ليدي.jpg"]' data-current="0">
                <button class="arrow-btn next-btn" onclick="moveSlide(this, 1)">❮</button>
            </div>
            <h3>رولكس ليدي ديت جست</h3>
            <span class="price">42,000 ريال</span>
            <button class="details-btn" onclick="showWatch('رولكس ليدي ديت جست', '42,000 ريال', 'الجمال الكلاسيكي المستمر، ساعة رولكس النسائية الأكثر شهرة في العالم.', 'image/ليدي.jpg')">تفاصيل القطعة</button>
        </div>

        <div class="product-card">
            <div class="image-slider">
                <button class="arrow-btn prev-btn" onclick="moveSlide(this, -1)">❯</button>
                <img class="slider-img" src="image/ششش.jpg" data-imgs='["image/شششش.jpg", "image/ششش.jpg"]' data-current="0">
                <button class="arrow-btn next-btn" onclick="moveSlide(this, 1)">❮</button>
            </div>
            <h3>شوبارد كلاسيك</h3>
            <span class="price">10,000 ريال</span>
            <button class="details-btn" onclick="showWatch('شوبارد كلاسيك', '10,000 ريال', 'تصميم انسيابي رقيق يناسب جميع المناسبات الرسمية واليومية.', 'image/ششش.jpg')">تفاصيل القطعة</button>
        </div>

        <div class="product-card">
            <div class="image-slider">
                <button class="arrow-btn prev-btn" onclick="moveSlide(this, -1)">❯</button>
                <img class="slider-img" src="image/هوبلوو.jpg" data-imgs='["image/هوبلو.jpg","image/هوبلوو.jpg" ]' data-current="0">
                <button class="arrow-btn next-btn" onclick="moveSlide(this, 1)">❮</button>
            </div>
            <h3>هوبلو نسائية</h3>
            <span class="price">30,000 ريال</span>
            <button class="details-btn" onclick="showWatch('هوبلو نسائية', '30,000 ريال', 'إصدار خاص للسيدات اللواتي يبحثن عن التميز والجرأة في التصميم.', 'image/هوبلو.jpg')">تفاصيل القطعة</button>
        </div>

        <div class="product-card">
            <div class="image-slider">
                <button class="arrow-btn prev-btn" onclick="moveSlide(this, -1)">❯</button>
                <img class="slider-img" src="image/كارتيه1.jpg" data-imgs='["image/كارتيه.jpg", "image/كارتيه2.jpg","image/كارتيه1.jpg"]' data-current="0">
                <button class="arrow-btn next-btn" onclick="moveSlide(this, 1)">❮</button>
            </div>
            <h3>كارتييه بانثير</h3>
            <span class="price">28,500 ريال</span>
            <button class="details-btn" onclick="showWatch('كارتييه بانثير', '28,500 ريال', 'ساعة نسائية أيقونية مطلية بذهب الورد عيار 18، تعبر عن الرقي والنعومة.', 'image/كارتيه1.jpg')">تفاصيل القطعة</button>
        </div>

        <div class="product-card">
            <div class="image-slider">
                <button class="arrow-btn prev-btn" onclick="moveSlide(this, -1)">❯</button>
                <img class="slider-img" src="image/شوباردن.jpg" data-imgs='["image/شوباردن1.jpg", "image/شوباردن.jpg"]' data-current="0">
                <button class="arrow-btn next-btn" onclick="moveSlide(this, 1)">❮</button>
            </div>
            <h3>شوبارد هابي دايموندز</h3>
            <span class="price">20,000 ريال</span>
            <button class="details-btn" onclick="showWatch('شوبارد هابي دايموندز', '20,000 ريال', 'تتميز بفصوص الألماس التي تتحرك بحرية لتعطي بريقاً مذهلاً مع كل حركة يد.', 'image/شوباردن.jpg')">تفاصيل القطعة</button>
        </div>

        <div class="product-card">
            <div class="image-slider">
                <button class="arrow-btn prev-btn" onclick="moveSlide(this, -1)">❯</button>
                <img class="slider-img" src="image/شوبارد.jpg" data-imgs='["image/1شوبارد.jpg", "image/شوبارد.jpg" ]' data-current="0">
                <button class="arrow-btn next-btn" onclick="moveSlide(this, 1)">❮</button>
            </div>
            <h3>شوبارد رويال</h3>
            <span class="price">25,000 ريال</span>
            <button class="details-btn" onclick="showWatch('شوبارد رويال', '25,000 ريال', 'فخامة لا توصف مع إطار مرصع بالكامل بأحجار الزركون الفاخرة.', 'image/شوبارد.jpg')">تفاصيل القطعة</button>
        </div>
    </section>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="hideModal()">&times;</span>
            <div class="modal-body">
                <img id="modal-img" src="" alt="صورة الساعة">
                <div class="modal-info">
                    <h2 id="modal-name">اسم الساعة</h2>
                    <span id="modal-price" class="price"></span>
                    <p id="modal-desc"></p>
                    <button style="background:var(--gold); border:none; padding:15px; width:100%; font-weight:bold; cursor:pointer;">أضف للسلة</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function moveSlide(button, step) {
            const slider = button.parentElement;
            const imgTag = slider.querySelector('.slider-img');
            const images = JSON.parse(imgTag.getAttribute('data-imgs'));
            let currentIndex = parseInt(imgTag.getAttribute('data-current'));
            currentIndex += step;
            if (currentIndex >= images.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = images.length - 1;
            imgTag.src = images[currentIndex];
            imgTag.setAttribute('data-current', currentIndex);
        }

        const modal = document.getElementById("infoModal");
        function showWatch(name, price, desc, currentImg) {
            document.getElementById("modal-name").innerText = name;
            document.getElementById("modal-price").innerText = price;
            document.getElementById("modal-desc").innerText = desc;
            document.getElementById("modal-img").src = currentImg;
            modal.style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function hideModal() {
            modal.style.display = "none";
            document.body.style.overflow = "auto";
        }

        window.onclick = function(event) {
            if (event.target == modal) hideModal();
        }
    </script>
</body>
</html>
